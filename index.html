  <body>
    <!--
      Static skeleton. Texts are placeholders: src/i18n fills every [data-i18n] element.
      Overlay screens (menu, pause, results…) are rendered by src/ui/overlay.ts.
      Layout mode is set by src/ui/layout.ts: data-layout="page|compact", data-touch="true|false".
    -->
    <div id="app" class="app" data-layout="page" data-touch="false">
      <header id="topbar" class="topbar">
        <div class="brand">
          <span class="brand__logo" aria-hidden="true">☾</span>
          <div>
            <h1 class="brand__title">PIXEL NIGHT</h1>
            <p class="brand__tagline" data-i18n="app.tagline">A TINY NIGHT ADVENTURE</p>
          </div>
        </div>
        <div class="topbar__actions">
          <button
            id="btn-sound"
            class="btn btn--mini"
            type="button"
            data-i18n-label="ui.sound"
            data-i18n-title="ui.sound"
          >
            ♪
          </button>
          <button
            id="btn-pause"
            class="btn btn--mini"
            type="button"
            data-i18n-label="ui.pause"
            data-i18n-title="ui.pause"
          >
            ❚❚
          </button>
          <button
            id="btn-fullscreen"
            class="btn btn--mini"
            type="button"
            data-i18n-label="ui.fullscreen"
            data-i18n-title="ui.fullscreen"
          >
            ⛶
          </button>
        </div>
      </header>

      <section id="hud" class="hud" aria-live="polite">
        <div class="hud__stat">
          <small data-i18n="hud.level">РІВЕНЬ</small><strong id="hud-level">1 / 5</strong>
        </div>
        <div class="hud__stat">
          <small data-i18n="hud.fireflies">СВІТЛЯЧКИ</small
          ><strong id="hud-fireflies">0 / 8</strong>
        </div>
        <div class="hud__stat">
          <small data-i18n="hud.lives">ЖИТТЯ</small><strong id="hud-lives">♥ ♥ ♥</strong>
        </div>
        <div class="hud__stat">
          <small data-i18n="hud.score">РАХУНОК</small><strong id="hud-score">0</strong>
        </div>
      </section>

      <div id="stage" class="stage">
        <canvas
          id="game"
          width="240"
          height="160"
          aria-label="Pixel Night"
          data-i18n-label="app.canvasLabel"
        ></canvas>
        <div id="overlay" class="overlay" hidden></div>
      </div>

      <div id="dpad" class="dpad" aria-hidden="true">
        <span></span><button type="button" data-dir="up">↑</button><span></span>
        <button type="button" data-dir="left">←</button>
        <button type="button" data-dir="down">↓</button>
        <button type="button" data-dir="right">→</button>
      </div>

      <section class="info">
        <div class="panel">
          <h2 class="panel__title" data-i18n="info.controls.title">КЕРУВАННЯ</h2>
          <p class="panel__text" data-i18n="info.controls.text">
            WASD / стрілки · Esc — пауза · M — звук
          </p>
          <p class="panel__text" data-i18n="info.controls.hint">
            Збирай ❤️ для відновлення життя · Утримуй кнопку або клавішу для руху
          </p>
        </div>
        <div class="panel">
          <h2 class="panel__title" data-i18n="info.bestiary.title">МЕШКАНЦІ ЛІСУ</h2>
          <ul id="bestiary" class="bestiary"></ul>
        </div>
      </section>

      <footer class="footer">PIXEL NIGHT · <span id="app-version"></span></footer>
    </div>
  </body>
</html>
